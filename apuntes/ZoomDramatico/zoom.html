<!DOCTYPE html>
<html lang="es">

<head>
    <title>Zoom al Centro Galáctico - Infrarrojo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #aladin-lite-div { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        .loading-indicator {
            display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1); pointer-events: none; font-weight: 500;
        }
        .loading-indicator.active { display: block; animation: pulseGlow 1.5s ease-in-out infinite; }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4); } 50% { box-shadow: 0 8px 32px rgba(100, 180, 255, 0.2); } }

        .reset-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 100;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 10px 16px;
            border-radius: 30px; font-size: 12px; cursor: pointer; transition: all 0.3s ease;
        }
        .reset-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }

        .aladin-controls, .aladin-goto-control, .aladin-layers-control, .aladin-simbad-control, .aladin-frame { display: none !important; }
    </style>
</head>
<body>

    <div id="aladin-lite-div"></div>

    <script>
        $(document).ready(function() {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            // Coordenadas del Centro Galáctico (Sgr A*)
            const GALACTIC_CENTER = "266.405 -29.008";
            // Survey inicial (Óptico) y final (Infrarrojo - Spitzer GLIMPSE360)
            const SURVEY_OPTICAL = "P/DSS2/color";
            const SURVEY_INFRARED = "P/GLIMPSE360";

            let aladin;
            let animInterval = null;
            let isAnimating = false;

            // Inicializar Aladin con un FOV grande (zoom out)
            A.init.then(() => {
                aladin = A.aladin('#aladin-lite-div', {
                    survey: SURVEY_OPTICAL,
                    fov: 180, // Iniciamos muy abierto
                    target: GALACTIC_CENTER,
                    showControls: false,
                    showGotoControl: false,
                    showLayersControl: false,
                    showFrame: false,
                    showSimbadPointerControl: false,
                    showObjectTooltip: false,
                    fullScreen: true
                });

                // Lanzar animación automáticamente tras 1 segundo
                setTimeout(() => {
                    startAnimation();
                }, 1000);
            });

            // Función para mostrar el estado
            function showStatus(text) {
                $('#loadingIndicator').text(text).addClass('active');
            }

            function hideStatus() {
                $('#loadingIndicator').removeClass('active');
            }

            // Easing suave para el movimiento
            function easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            // Animación principal
            function startAnimation() {
                if (isAnimating) return;
                isAnimating = true;

                // 1. FASE DE ZOOM OUT MÁXIMO
                // Forzamos el campo visual a 360 grados (o el máximo permitido por el survey)
                aladin.setFov(360);
                aladin.gotoObject(GALACTIC_CENTER);
                showStatus("🌌 Zoom out máximo...");

                setTimeout(() => {
                    // 2. FASE DE ACERCAMIENTO (ZOOM IN)
                    showStatus("🔭 Acercando al Centro Galáctico...");

                    const startFov = 360;
                    const endFov = 0.5; // Zoom final (ajusta si quieres más cerca)
                    const duration = isMobile ? 6000 : 5000;
                    const startTime = Date.now();

                    // Limpiar cualquier intervalo previo
                    if (animInterval) clearInterval(animInterval);

                    animInterval = setInterval(() => {
                        const elapsed = Date.now() - startTime;
                        let progress = Math.min(elapsed / duration, 1);
                        let ease = easeInOutCubic(progress);

                        // Calcular FOV actual
                        let currentFov = startFov - (startFov - endFov) * ease;

                        // Si el FOV es muy pequeño, forzar el cambio a infrarrojo antes de terminar
                        if (currentFov <= 0.8 && aladin.getBaseImageLayer().id !== SURVEY_INFRARED) {
                            // CAMBIO A INFRARROJO
                            aladin.setImageSurvey(SURVEY_INFRARED);
                            showStatus("🔥 Cambiando a Infrarrojo (Spitzer)...");
                        }

                        aladin.setFov(currentFov);
                        aladin.gotoObject(GALACTIC_CENTER);

                        if (progress >= 1) {
                            clearInterval(animInterval);
                            animInterval = null;
                            isAnimating = false;

                            // Asegurar que estamos en infrarrojo al final
                            aladin.setImageSurvey(SURVEY_INFRARED);
                            aladin.setFov(endFov);

                            showStatus("✅ Centro Galáctico en Infrarrojo");
                            setTimeout(hideStatus, 2000);
                        }
                    }, isMobile ? 30 : 20);

                }, 2000); // Esperar 2 segundos después del zoom out para empezar a acercar
            }

            // Botón para reiniciar la animación
            $('#resetBtn').click(function() {
                if (animInterval) clearInterval(animInterval);
                isAnimating = false;
                hideStatus();

                // Volver al estado óptico y zoom out
                aladin.setImageSurvey(SURVEY_OPTICAL);
                aladin.setFov(360);
                aladin.gotoObject(GALACTIC_CENTER);

                // Reiniciar
                setTimeout(() => {
                    startAnimation();
                }, 500);
            });

            // Prevenir scroll en móvil
            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            // Ocultar UI de Aladin
            setTimeout(function() {
                $('.aladin-controls, .aladin-goto-control, .aladin-layers-control, .aladin-simbad-control, .aladin-frame').hide();
            }, 100);
        });
    </script>

    <!-- Botón de reinicio (opcional) -->
    <button id="resetBtn" class="reset-btn">🔄 Reiniciar</button>
    <div id="loadingIndicator" class="loading-indicator"></div>

</body>
</html>
