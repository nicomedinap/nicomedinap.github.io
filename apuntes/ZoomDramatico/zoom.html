<!DOCTYPE html>
<html lang="es">

<head>
    <title>Zoom al Centro Galáctico - 2MASS Infrarrojo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #aladin-lite-div { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        .loading-indicator {
            display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1); pointer-events: none; font-weight: 500;
        }
        .loading-indicator.active { display: block; animation: pulseGlow 1.5s ease-in-out infinite; }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4); } 50% { box-shadow: 0 8px 32px rgba(100, 180, 255, 0.2); } }

        .reset-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 100;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 10px 16px;
            border-radius: 30px; font-size: 12px; cursor: pointer; transition: all 0.3s ease;
        }
        .reset-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }

        .aladin-controls, .aladin-goto-control, .aladin-layers-control, .aladin-simbad-control, .aladin-frame { display: none !important; }
    </style>
</head>
<body>

    <div id="aladin-lite-div"></div>

    <script>
        $(document).ready(function() {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            const GALACTIC_CENTER = "266.405 -29.008";
            const SURVEY_OPTICAL = "P/DSS2/color";
            const SURVEY_2MASS = "P/2MASS/color";

            let aladin;
            let animInterval = null;
            let isAnimating = false;

            A.init.then(() => {
                aladin = A.aladin('#aladin-lite-div', {
                    survey: SURVEY_OPTICAL,
                    fov: 180,
                    target: GALACTIC_CENTER,
                    showControls: false,
                    showGotoControl: false,
                    showLayersControl: false,
                    showFrame: false,
                    showSimbadPointerControl: false,
                    showObjectTooltip: false,
                    fullScreen: true
                });

                setTimeout(() => {
                    startAnimation();
                }, 1500);
            });

            function showStatus(text) {
                $('#loadingIndicator').text(text).addClass('active');
            }

            function hideStatus() {
                $('#loadingIndicator').removeClass('active');
            }

            // Easing muy suave (quíntica) para un viaje lento y cinematográfico
            function easeInOutQuint(t) {
                return t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2;
            }

            function startAnimation() {
                if (isAnimating) return;
                isAnimating = true;

                // 1. ZOOM OUT MÁXIMO
                aladin.setFov(360);
                aladin.gotoObject(GALACTIC_CENTER);
                showStatus("🌌 Zoom out máximo...");

                // Pausa larga para contemplar todo el cielo
                setTimeout(() => {
                    // 2. VIAJE MUY LENTO HACIA EL CENTRO GALÁCTICO
                    showStatus("🔭 Viajando lentamente al Centro Galáctico...");

                    const startFov = 360;
                    const endFov = 0.3;
                    // Viaje MUY lento: 25 segundos escritorio, 30 segundos móvil
                    const duration = isMobile ? 30000 : 25000;
                    const startTime = Date.now();

                    if (animInterval) clearInterval(animInterval);

                    animInterval = setInterval(() => {
                        const elapsed = Date.now() - startTime;
                        let progress = Math.min(elapsed / duration, 1);
                        let ease = easeInOutQuint(progress);

                        let currentFov = startFov - (startFov - endFov) * ease;

                        // Cambio a 2MASS cerca del final del recorrido
                        if (currentFov <= 0.6 && aladin.getBaseImageLayer().id !== SURVEY_2MASS) {
                            aladin.setImageSurvey(SURVEY_2MASS);
                            showStatus("🔥 Cambiando a Infrarrojo 2MASS...");
                        }

                        aladin.setFov(currentFov);
                        aladin.gotoObject(GALACTIC_CENTER);

                        if (progress >= 1) {
                            clearInterval(animInterval);
                            animInterval = null;
                            isAnimating = false;

                            aladin.setImageSurvey(SURVEY_2MASS);
                            aladin.setFov(endFov);

                            showStatus("✅ Centro Galáctico en 2MASS");
                            setTimeout(hideStatus, 3000);
                        }
                    }, isMobile ? 50 : 40); // Updates más espaciados = movimiento más pausado

                }, 5000); // 5 segundos de pausa en el zoom out máximo
            }

            $('#resetBtn').click(function() {
                if (animInterval) clearInterval(animInterval);
                isAnimating = false;
                hideStatus();

                aladin.setImageSurvey(SURVEY_OPTICAL);
                aladin.setFov(360);
                aladin.gotoObject(GALACTIC_CENTER);

                setTimeout(() => {
                    startAnimation();
                }, 1000);
            });

            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            setTimeout(function() {
                $('.aladin-controls, .aladin-goto-control, .aladin-layers-control, .aladin-simbad-control, .aladin-frame').hide();
            }, 100);
        });
    </script>

    <button id="resetBtn" class="reset-btn">🔄 Reiniciar</button>
    <div id="loadingIndicator" class="loading-indicator"></div>

</body>
</html>
